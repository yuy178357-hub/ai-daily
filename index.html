<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI日报 · 历史归档</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%); color: #1e293b; }
.container { max-width: 720px; margin: 0 auto; padding: 16px; }
.topbar { position: sticky; top: 0; z-index: 10; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border-radius: 16px; padding: 16px 20px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 6px 24px rgba(102,126,234,0.3); }
.topbar-title { font-size: 18px; font-weight: 800; }
.topbar-date { font-size: 13px; opacity: 0.9; margin-left: auto; }
.btn-calendar { background: rgba(255,255,255,0.2); border: none; color: #fff; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
.btn-calendar:hover { background: rgba(255,255,255,0.3); }
.frame-wrap { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); min-height: 600px; }
iframe { width: 100%; height: 80vh; border: none; }
/* 日历弹窗 */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 20px; padding: 20px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.modal-header { display: flex; align-items: center; margin-bottom: 16px; }
.modal-month { font-size: 18px; font-weight: 700; flex: 1; text-align: center; }
.modal-nav { background: #f1f5f9; border: none; width: 36px; height: 36px; border-radius: 10px; font-size: 18px; cursor: pointer; color: #475569; }
.modal-nav:hover { background: #e2e8f0; }
.modal-close { position: absolute; top: 16px; right: 20px; background: none; border: none; font-size: 24px; color: #94a3b8; cursor: pointer; }
.weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 8px; }
.weekdays div { text-align: center; font-size: 12px; color: #94a3b8; font-weight: 600; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 14px; border-radius: 10px; cursor: pointer; position: relative; }
.day.empty { cursor: default; }
.day.has-report { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; font-weight: 700; }
.day.has-report:hover { transform: scale(1.05); }
.day.no-report { color: #cbd5e1; cursor: not-allowed; }
.day.out-of-window { color: #e2e8f0; cursor: not-allowed; }
.day.today-mark { box-shadow: 0 0 0 2px #f59e0b inset; }
.modal-hint { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 12px; }
.legend { display: flex; gap: 16px; justify-content: center; margin-top: 10px; font-size: 12px; color: #64748b; }
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-dot { width: 12px; height: 12px; border-radius: 4px; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <span class="topbar-title">🤖 AI日报 · 历史归档</span>
    <span class="topbar-date" id="currentDateLabel">2026-08-14</span>
    <button class="btn-calendar" id="openCalendar">📅 选择日期</button>
  </div>
  <div class="frame-wrap">
    <iframe id="reportFrame" src="reports/2026-08-14.html" title="AI日报"></iframe>
  </div>
</div>

<div class="modal-overlay" id="calendarModal">
  <div class="modal">
    <button class="modal-close" id="closeCalendar">×</button>
    <div class="modal-header">
      <button class="modal-nav" id="prevMonth">‹</button>
      <div class="modal-month" id="monthLabel"></div>
      <button class="modal-nav" id="nextMonth">›</button>
    </div>
    <div class="weekdays">
      <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
    </div>
    <div class="days" id="daysGrid"></div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:linear-gradient(135deg,#667eea,#764ba2);"></div>有报告</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f59e0b;"></div>今天</div>
    </div>
    <div class="modal-hint">近 90 天内有报告的日期可点击查看</div>
  </div>
</div>

<script>
const AVAILABLE_DATES = ["2026-05-16", "2026-05-17", "2026-05-18", "2026-05-19", "2026-05-20", "2026-05-21", "2026-05-22", "2026-05-23", "2026-05-24", "2026-05-25", "2026-05-26", "2026-05-27", "2026-05-28", "2026-05-29", "2026-05-30", "2026-05-31", "2026-06-01", "2026-06-02", "2026-06-03", "2026-06-04", "2026-06-05", "2026-06-06", "2026-06-07", "2026-06-08", "2026-06-09", "2026-06-10", "2026-06-11", "2026-06-12", "2026-06-13", "2026-06-14", "2026-06-15", "2026-06-16", "2026-06-17", "2026-06-21", "2026-06-22", "2026-06-23", "2026-06-24", "2026-06-25", "2026-06-26", "2026-06-27", "2026-06-28", "2026-06-29", "2026-06-30", "2026-07-01", "2026-07-02", "2026-07-03", "2026-07-04", "2026-07-05", "2026-07-06", "2026-07-07", "2026-07-08", "2026-07-09", "2026-07-10", "2026-07-11", "2026-07-12", "2026-07-13", "2026-07-14", "2026-07-15", "2026-07-16", "2026-07-17", "2026-07-18", "2026-07-19", "2026-07-20", "2026-07-21", "2026-07-22", "2026-07-23", "2026-07-24", "2026-07-25", "2026-07-26", "2026-07-27", "2026-08-04", "2026-08-05", "2026-08-06", "2026-08-07", "2026-08-08", "2026-08-09", "2026-08-10", "2026-08-11", "2026-08-12", "2026-08-13", "2026-08-14"];
const WINDOW_DAYS = 90;
const TODAY = "2026-08-14";

const todayDate = new Date(TODAY + "T00:00:00");
let viewYear = todayDate.getFullYear();
let viewMonth = todayDate.getMonth();  // 0-11

const weekdayNames = ['日','一','二','三','四','五','六'];

function fmt(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function isInWindow(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const diffDays = Math.floor((todayDate - d) / (1000 * 60 * 60 * 24));
  return diffDays >= 0 && diffDays <= WINDOW_DAYS;
}

function renderCalendar() {
  const monthLabel = document.getElementById('monthLabel');
  monthLabel.textContent = `${viewYear}年${viewMonth + 1}月`;

  const grid = document.getElementById('daysGrid');
  grid.innerHTML = '';

  const firstDay = new Date(viewYear, viewMonth, 1);
  const startWeekday = firstDay.getDay();  // 0=周日
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

  // 前置空格
  for (let i = 0; i < startWeekday; i++) {
    const empty = document.createElement('div');
    empty.className = 'day empty';
    grid.appendChild(empty);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = fmt(new Date(viewYear, viewMonth, d));
    const cell = document.createElement('div');
    cell.textContent = d;

    const hasReport = AVAILABLE_DATES.includes(dateStr);
    const inWindow = isInWindow(dateStr);
    const isToday = dateStr === TODAY;

    if (hasReport && inWindow) {
      cell.className = 'day has-report' + (isToday ? ' today-mark' : '');
      cell.onclick = () => selectDate(dateStr);
    } else if (!inWindow) {
      cell.className = 'day out-of-window';
    } else {
      cell.className = 'day no-report' + (isToday ? ' today-mark' : '');
    }
    grid.appendChild(cell);
  }
}

function selectDate(dateStr) {
  document.getElementById('reportFrame').src = `reports/${dateStr}.html`;
  document.getElementById('currentDateLabel').textContent = dateStr;
  closeCalendar();
}

function openCalendar() {
  document.getElementById('calendarModal').classList.add('show');
}
function closeCalendar() {
  document.getElementById('calendarModal').classList.remove('show');
}

document.getElementById('openCalendar').onclick = openCalendar;
document.getElementById('closeCalendar').onclick = closeCalendar;
document.getElementById('calendarModal').onclick = (e) => {
  if (e.target.id === 'calendarModal') closeCalendar();
};
document.getElementById('prevMonth').onclick = () => {
  viewMonth--;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  renderCalendar();
};
document.getElementById('nextMonth').onclick = () => {
  viewMonth++;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
};

renderCalendar();
</script>
</body>
</html>
